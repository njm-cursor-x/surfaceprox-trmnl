name: Weather
description: Current conditions and forecast from Open-Meteo. Uses your location; no API key.
strategy: polling
refresh_frequency: 15
custom_fields:
  - keyname: location_name
    field_type: string
    name: Label (blank = location name)
    optional: true
  - keyname: lat
    field_type: number
    name: Latitude override
    optional: true
  - keyname: lon
    field_type: number
    name: Longitude override
    optional: true
slate:
  connectors:
    weather:
      use: open-meteo
      with:
        lat: "{{ settings.lat | default: location.lat }}"
        lon: "{{ settings.lon | default: location.lon }}"
        units: "{{ units.temperature }}"
  sizes:
    min: { w: 2, h: 2 }
    max: { w: 12, h: 8 }
    default: { w: 4, h: 3 }
    presets:
      small: { w: 3, h: 2 }
      medium: { w: 4, h: 3 }
      wide: { w: 8, h: 3 }
      full: { w: 12, h: 8 }
