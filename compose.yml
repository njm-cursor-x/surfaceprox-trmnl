# docker compose up -d   then open http://<host>:8787 from any browser on your LAN.
services:
  slate:
    image: ghcr.io/njm-cursor-x/surfaceprox-trmnl:latest
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: slate
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - slate-data:/data

volumes:
  slate-data:
